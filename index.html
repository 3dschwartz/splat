<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gaussian Splat Teleport Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.20.4/build/playcanvas.mjs"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05050a; font-family: system-ui, sans-serif; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; box-sizing: border-box;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    color: #eee; font-size: 13px; pointer-events: none;
    gap: 12px;
  }
  #ui * { pointer-events: auto; }
  #status { opacity: 0.85; max-width: 60vw; }
  #controls { display: flex; align-items: center; gap: 8px; }
  #controls label { font-size: 12px; opacity: 0.8; }
  #controls input[type="number"] { width: 56px; }
  #file-input { color: #eee; font-size: 12px; }

  #dropzone {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,20,0.55);
    border: 2px dashed rgba(255,255,255,0.4);
    color: #fff; font-size: 20px; text-align: center;
    pointer-events: none;
  }
  #dropzone.hidden { display: none; }

  #teleport-fade {
    position: fixed; inset: 0; z-index: 10;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 90ms linear;
  }

  #help {
    position: fixed; bottom: 10px; left: 14px; z-index: 4;
    color: #ccc; font-size: 12px; opacity: 0.75; max-width: 420px;
    background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 6px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="status">Initialisiere …</div>
  <div id="controls">
    <label>Voxelgröße (m)
      <input id="voxel-resolution" type="number" step="0.01" min="0.02" value="0.15">
    </label>
    <input id="file-input" type="file" accept=".ply,.sog,.compressed.ply">
  </div>
</div>

<div id="dropzone" class="hidden">Splat-Datei hier ablegen (.ply / .compressed.ply / .sog)</div>
<div id="teleport-fade"></div>
<div id="help">
  <strong>Steuerung:</strong> Klick = Teleport zum angeklickten Punkt (Boden/Wand-Check via Voxelgrid) ·
  Ziehen mit gedrückter Maustaste = Umschauen.<br>
  Voxel-Kollision wird aktuell nur aus <code>.ply</code>-Dateien berechnet.
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
